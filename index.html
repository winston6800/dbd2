<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf6ef" />

    <title>Chapters — every chapter of a book, summarized and illustrated</title>
    <meta
      name="description"
      content="Drop in a PDF and get back a shelf of chapter cards: an engaging summary and a generated image for each chapter's central idea."
    />

    <!-- Link previews (Reddit, Twitter, Slack, iMessage). VITE_APP_URL must be
         set at build time or these resolve to a relative path some scrapers
         will not follow. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chapters" />
    <meta property="og:title" content="Every chapter of a book, in three paragraphs and one picture." />
    <meta
      property="og:description"
      content="Drop in a PDF. Chapters reads it, summarizes each chapter, and generates an image for its central idea."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Every chapter of a book, in three paragraphs and one picture." />
    <meta
      name="twitter:description"
      content="Drop in a PDF. Chapters reads it, summarizes each chapter, and generates an image for its central idea."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
