<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e8" />

    <title>Monster Goals — turn the goal you keep avoiding into a boss fight</title>
    <meta
      name="description"
      content="A goal tracker shaped like a boss fight. Name your goal, break it into mini-bosses, and deploy Milk units by finishing tasks until every boss falls."
    />

    <!-- Link previews (Reddit, Twitter, Slack, iMessage). VITE_APP_URL must be
         set at build time or these resolve to a relative path some scrapers
         will not follow. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monster Goals" />
    <meta property="og:title" content="Turn the goal you keep avoiding into a monster." />
    <meta
      property="og:description"
      content="Break your goal into mini-bosses. Every task you finish deploys a Milk unit that fires on the boss until it drops."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Turn the goal you keep avoiding into a monster." />
    <meta
      name="twitter:description"
      content="Break your goal into mini-bosses. Every task you finish deploys a Milk unit that fires on the boss until it drops."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
