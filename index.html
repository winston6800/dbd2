<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c0f" />

    <title>Frontier — a thinking net for the thing that doesn't exist yet</title>
    <meta
      name="description"
      content="Chat is the wrong shape for invention. Frontier grows your thinking as a graph: every node is a conversation with an agent that pushes outward, and the unexplored edges glow."
    />

    <!-- Link previews (Reddit, Twitter, Slack, iMessage). VITE_APP_URL must be
         set at build time or these resolve to a relative path some scrapers
         will not follow. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frontier" />
    <meta property="og:title" content="Chat is the wrong shape for thinking." />
    <meta
      property="og:description"
      content="A graph of AI conversations pointed at the thing you're trying to make that doesn't exist yet. Every branch you don't take stays lit."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chat is the wrong shape for thinking." />
    <meta
      name="twitter:description"
      content="A graph of AI conversations pointed at the thing you're trying to make that doesn't exist yet. Every branch you don't take stays lit."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
