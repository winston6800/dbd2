<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <title>DeadByDefault — the Strava for founders who keep flaking on themselves</title>
    <meta
      name="description"
      content="A survival-style growth tracker for founders. Log daily loops, keep the Honor Code, and watch the streak compound. Share progress with groups and people you follow."
    />

    <!-- Link previews (Reddit, Twitter, Slack, iMessage). VITE_APP_URL must be
         set at build time or these resolve to a relative path some scrapers
         will not follow. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeadByDefault" />
    <meta property="og:title" content="The Strava for founders who keep flaking on themselves." />
    <meta
      property="og:description"
      content="Log daily loops, keep the Honor Code, and watch the streak compound. Share progress with groups and people you follow."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Strava for founders who keep flaking on themselves." />
    <meta
      name="twitter:description"
      content="Log daily loops, keep the Honor Code, and watch the streak compound. Share progress with groups and people you follow."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og.png" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gradient-red min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
