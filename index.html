<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08070a" />

    <title>DeadByDefault — rebuild the self-respect the internet chipped away</title>
    <meta
      name="description"
      content="DeadByDefault is where you fight back the version of you that the internet defaulted you into. Name the goal, break it into bosses, and deploy proof every time you keep a promise to yourself."
    />

    <!-- Link previews (Reddit, Twitter, Slack, iMessage). VITE_APP_URL must be
         set at build time or these resolve to a relative path some scrapers
         will not follow. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeadByDefault" />
    <meta property="og:title" content="Rebuild the self-respect the internet chipped away." />
    <meta
      property="og:description"
      content="DeadByDefault turns the promises you keep breaking into a boss fight. Every task you finish is a hit that lands."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rebuild the self-respect the internet chipped away." />
    <meta
      name="twitter:description"
      content="DeadByDefault turns the promises you keep breaking into a boss fight. Every task you finish is a hit that lands."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
